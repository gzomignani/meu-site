<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gabriel zomignani</title>
  <link rel="preload" href="fonts/host-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/cardo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <meta name="theme-color" content="#111" />
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#111">
  <style>
    :root{
      --bg:#fff; --fg:#111;
      --gap:clamp(16px, 2.8vw, 36px);
      --side-w:clamp(140px, 12vw, 220px);
      --side-h:clamp(360px, 62vh, 720px);
      --main-w:clamp(520px, calc(100vw - (2 * var(--side-w)) - (2 * var(--gap))), 1600px);
      --main-h:clamp(420px, 70vh, 860px);
      --text-gap:clamp(14px, 2.2vw, 28px);
      --ease:cubic-bezier(.22,.61,.36,1);
    }

    *{ box-sizing:border-box }
    html, body{ height:100% }
    body{
      margin:0; background:var(--bg); color:var(--fg);
      font-family:"Host Grotesk", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow-x:hidden;
      cursor:none;
    }

    /* ===== HERO ===== */
    .hero{ position:relative; height:100vh; height:100dvh; display:grid; place-items:center; }
    .hero__sticky{ position:sticky; top:0; height:100vh; height:100dvh; display:grid; place-items:center; }

    /*
      Landing layout — faithful to SVG reference (viewBox 0 0 1366 768)
      SVG proportions:
        - Left margin: 164/1366 = 12%
        - "gabriel" width: 688/1366 = 50.4% of viewport
        - "zomignani" width: 1038/1366 = 76% of viewport
        - Icon: sits right of "gabriel", vertically centered on gabriel x-height
        - Icon width: 177/1366 = 13% of viewport
        - Gap between gabriel and icon: ~85/1366 = 6.2%
        - Small text: 41.81/219 = 0.19x of large text (font ratio ~5.1:1)
        - Info text starts ~51 units below "zomignani" baseline
        - 3 lines: "são paulo fauusp", "design gráfico moda 2002", "zomignani@usp.br"
        - All left-aligned at x~164
        - Composition vertically centered with ~14.7% margins
    */
    .logoWrap{
      display:flex; flex-direction:column; align-items:flex-start;
      /* Match SVG left margin: 164/1366 ≈ 12% from left edge */
      padding-left:12vw;
      padding-right:12vw;
      width:100%;
    }

    .landing-name{
      display:flex; align-items:center;
      font-family:"Host Grotesk", sans-serif; font-weight:700;
      will-change:transform, opacity, filter, letter-spacing;
      /* "gabriel" in SVG occupies ~28.5% of viewport height (219px / 768px)
         Using vw-based sizing for horizontal fidelity: gabriel is ~50.4% wide
         At 76vw total for zomignani, font-size needs to make gabriel ~50.4% */
      font-size:clamp(60px, 14.2vw, 220px);
      line-height:0.82;
      color:var(--fg);
      white-space:nowrap;
    }
    .landing-name .name-text{ display:inline-block; }
    .landing-name .landing-icon{
      /* Icon in SVG: 177 units wide, gabriel text: 688 units wide
         177/688 = 0.257 of gabriel font-size
         But icon height matches gabriel x-height (cap height ~0.72em for Host Grotesk)
         Icon in SVG: 174 units tall. gabriel cap height: ~219 units.
         174/219 = 0.79em
         Gap between gabriel end and icon start: 85/688 ≈ 0.124em relative to font */
      height:0.80em;
      width:auto;
      display:inline-block;
      margin-left:0.12em;
      /* Vertically center on x-height / cap-height of gabriel */
      align-self:center;
      margin-top:0.02em;
    }

    .landing-surname{
      font-family:"Host Grotesk", sans-serif; font-weight:700;
      will-change:transform, opacity, filter, letter-spacing;
      /* "zomignani" in SVG: 1038 units wide, "gabriel" 688 units wide
         zomignani is 1.509x gabriel. Same font, so same font-size.
         The extra width comes from more characters. */
      font-size:clamp(60px, 14.2vw, 220px);
      line-height:0.82;
      color:var(--fg);
      margin:0;
      margin-top:-0.03em;
    }

    .landing-info{
      font-family:"Cardo", serif;
      font-weight:400;
      font-style:normal;
      will-change:transform, opacity, filter;
      /* SVG: small text is 41.81px, large text ~219px cap area
         41.81/219 ≈ 0.19. At 14.2vw base, info ≈ 14.2*0.19 = 2.7vw */
      font-size:clamp(12px, 2.7vw, 42px);
      line-height:1.15;
      color:var(--fg);
      text-align:justify;
      text-justify:inter-word;
      /* SVG gap: ~51 units below zomignani baseline (520 to 571)
         51/768 ≈ 6.6vh, but relative to font: 51/219 ≈ 0.23em of large text */
      margin-top:0.8em;
    }
    .landing-info-line{ display:block; }
    .landing-email{
      display:block;
      color:rgb(0,255,0);
      font-family:"Cardo", serif;
      font-weight:400;
      font-style:normal;
    }

    /* Brand icon — moves from landing icon position to fixed position, behind content */
    .brandIcon{
      position:fixed; left:0; top:0; width:90px; height:90px;
      opacity:0; pointer-events:none; z-index:0;
      will-change:transform, left, top, width, height;
    }
    .brandIcon img{ width:100%; height:100%; display:block; }

    /* ===== GALERIA (DESKTOP) ===== */
    .galeria{ height:100vh; height:100dvh; width:100vw; position:relative; }
    .stage{ position:relative; width:100%; height:100%; }

    .titulo{
      position:absolute; left:calc(50% - var(--main-w)/2); top:calc(50% - var(--main-h)/2);
      transform:translateY(calc(-100% - var(--text-gap)));
      margin:0; font-weight:600; font-size:clamp(20px, 2.4vw, 32px);
    }
    .descricao{
      position:absolute; left:calc(50% - var(--main-w)/2); top:calc(50% + var(--main-h)/2 + var(--text-gap));
      width:var(--main-w);
      margin:0; font-weight:500; font-size:clamp(14px, 2vw, 22px); line-height:1.3; text-align:left;
    }

    .carousel{ position:absolute; inset:0; }
    .projeto{
      position:absolute; cursor:pointer; user-select:none;
      will-change:transform, width, height, opacity;
      margin:0;
    }
    .frame{ position: relative; width:100%; height:100%; overflow:hidden; }

    /* 3-panel carousel: edge-to-edge */
    .pos-centro{ width:var(--main-w); height:var(--main-h); opacity:1; z-index:3; transform:translate3d(calc(50vw - 50%), calc(50vh - 50%), 0) scale(1); }
    .pos-esq  { width:var(--side-w); height:var(--side-h); opacity:1; z-index:2; transform:translate3d(0, calc(50vh - 50%), 0) scale(.965); transform-origin:left center; }
    .pos-dir  { width:var(--side-w); height:var(--side-h); opacity:1; z-index:2; transform:translate3d(calc(100vw - var(--side-w)), calc(50vh - 50%), 0) scale(.965); transform-origin:right center; }
    .pos-fila { width:var(--side-w); height:var(--side-h); opacity:0; z-index:1; transform:translate3d(120vw, calc(50vh - 50%), 0) scale(.94); }

    .frame > .layer{
      position:absolute; inset:0;
      background-position:center; background-repeat:no-repeat; background-size:cover;
      opacity:1; will-change:opacity; pointer-events:none;
    }
    .carousel .pos-esq   .frame > .layer{ background-position:right center; }
    .carousel .pos-dir   .frame > .layer{ background-position:left  center; }
    .carousel .pos-centro .frame > .layer{ background-size:contain; background-position:center; background-color:var(--bg); }

    @media (prefers-reduced-motion: reduce){ .landing-name, .landing-surname, .landing-info, .projeto{ transition:none !important; } }

    /* ===== LISTA (MOBILE) ===== */
    .listaMobile{ display:none; }

    @media (max-width: 768px), (hover:none) and (pointer:coarse){
      .logoWrap{
        padding-left:2vw;
        padding-right:2vw;
      }
      .landing-name{
        font-size:clamp(56px, 19vw, 180px);
      }
      .landing-surname{
        font-size:clamp(56px, 19vw, 180px);
      }
      .landing-info{
        font-size:clamp(13px, 4.5vw, 30px);
      }
      .galeria{ height:auto; min-height:0; }
      .stage{ position:static; }
      .titulo, .descricao, .carousel{ display:none !important; }
      .listaMobile{ display:block; width:100%; }

      .projMobile{ width:100%; margin: clamp(12px, 3.2vw, 22px) 0; touch-action:pan-y; }
      .tituloMobile{ margin: 0 0 clamp(8px, 2.4vw, 12px) 0; padding:0 5px; font-weight:600; font-size: clamp(18px, 4vw, 24px); line-height:1.1; }

      .frameMobile{ position:relative; }
      .frameMobile .mediaWrap{ position:relative; width:100%; aspect-ratio:16 / 9; overflow:hidden; background:var(--bg); }
      .frameMobile .mediaWrap > img.layer{
        position:absolute; inset:0; width:100%; height:100%;
        object-fit:contain; display:block; opacity:0;
        pointer-events:none;
      }
      .frameMobile .mediaWrap > img.layer.on{ opacity:1; }

      .descricaoMobile{ margin: clamp(8px, 2.6vw, 14px) 0 0 0; padding:0 5px; font-weight:500; font-size: clamp(14px, 3.6vw, 18px); line-height:1.35; text-align:left; }
    }

    /* Decrypt — full opacity */
    .decrypt-char{ display:inline; }
    .decrypt-scrambled{ display:inline; }
  </style>

</head>
<body>
  <div class="brandIcon" id="brandIcon" aria-hidden="true"><img src="icone.svg" alt=""></div>

    <div class="hero__sticky">

        <div class="landing-name">

        </div>
        <div class="landing-surname" id="decryptZomignani">zomignani</div>
        <div class="landing-info" id="landingInfo">
          <span class="landing-info-line" id="decryptLine1">2002 são paulo fauusp</span>
          <span class="landing-info-line" id="decryptLine2">design gráfico moda </span>
          <span class="landing-email" id="decryptEmail">zomignani@usp.br</span>
        </div>
      </div>
    </div>
  </section>

  <section class="galeria" aria-label="Galeria">

      <div class="carousel" id="carousel"></div>
      <p class="descricao" id="descricao"></p>
      <div class="listaMobile" id="listaMobile" aria-label="Projetos (mobile)"></div>
    </div>
  </section>

<!-- Cursor custom (desktop) -->
<script>
(() => {
  if(!matchMedia('(pointer: fine)').matches || matchMedia('(prefers-reduced-motion: reduce)').matches) { document.body.style.cursor = 'auto'; return; }
  const style = document.createElement('style');
  style.textContent = `
    .cursor-disc{ position:fixed; left:0; top:0; width:36px; height:36px; background:#fff; border-radius:0%; pointer-events:none; mix-blend-mode:difference; transform:translate(-50%,-50%); z-index:2147483647; opacity:0; transition: width .12s ease-out, height .12s ease-out, opacity .18s ease-out, background-color .12s ease-out, mix-blend-mode .12s ease-out; }
    .cursor-disc.is-visible{ opacity:1; }
    .cursor-disc.is-down{ --press:.9; }
    .cursor-disc.is-hot{ background:#fff; border-radius:50%; mix-blend-mode:difference; }
    html, body, :where(a, button, input, select, textarea, label, summary,[role="button"],[role="link"],.clickable,[onclick],[tabindex]){ cursor:none !important; }
  `;
  (document.head || document.documentElement).appendChild(style);
  const disc = document.createElement('div'); disc.className = 'cursor-disc'; disc.setAttribute('aria-hidden','true'); document.body.appendChild(disc);
  const sel = 'a,button,input,select,textarea,summary,label,[role="button"],[role="link"],.clickable';
  const isClickable = el => !!(el && (el.closest(sel) || getComputedStyle(el).cursor === 'pointer' || el.onclick || el.getAttribute('onclick')));
  let x=0, y=0, raf=null;
  const draw = () => { disc.style.transform = 'translate3d('+x+'px,'+y+'px,0) translate(-50%,-50%) scale(var(--press,1))'; raf = null; };
  addEventListener('mousemove', e => { x=e.clientX; y=e.clientY; disc.classList.add('is-visible'); disc.classList.toggle('is-hot', isClickable(e.target)); if(!raf) raf=requestAnimationFrame(draw); }, {passive:true});
  addEventListener('mouseleave', () => disc.classList.remove('is-visible'), {passive:true});
  addEventListener('mousedown', () => disc.classList.add('is-down'), {passive:true});
  addEventListener('mouseup', () => disc.classList.remove('is-down'), {passive:true});
})();
</script>
